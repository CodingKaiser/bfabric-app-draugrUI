stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/

# --- Docker ---

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --target web -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$DOCKER_IMAGE:latest" .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Tests ---

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir .[dev]
  script:
    - python -m pytest tests/ -v
  allow_failure: true

# --- Deploy (manual) ---

deploy-docker:
  stage: deploy
  when: manual
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker pull "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Deploy $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA to production"
    # Customize: ssh to server, docker compose pull, docker compose up -d
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
